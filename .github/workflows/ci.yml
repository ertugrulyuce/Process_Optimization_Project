# CI: testler + import kontrolu.
#
# Ham veri repoda yok (bkz. .gitignore), bu yuzden CI pipeline'i CALISTIRMAZ.
# Calistirilabilecek iki sey var: (1) veriye dokunmayan testler, (2) her
# modulun import edilebilirligi -- src/ duz dizin yapisinda oldugu icin
# (paket degil) bir dosya tasindiginda import zinciri sessizce kirilabiliyor.
name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12", "3.13"]

    steps:
      - uses: actions/checkout@v4

      - name: Python ${{ matrix.python-version }} kur
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
          cache-dependency-path: |
            requirements.txt
            requirements-dev.txt

      - name: Bagimliliklari kur
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-dev.txt

      - name: Import kontrolu
        run: python tools/check_imports.py

      - name: Testler
        run: pytest
